<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.name }}</title>
</head>
<link rel= "stylesheet" type= "text/css" href= "{{ url_for('static',filename='styles/main.css') }}">
<body>
    <!-- Subtle frame container -->
    <div class="frame">
        <!-- Page Title -->
        <header class="header">
            <h1>{{ config.name }}</h1>
            <a href="{{ url_for('settings.settings_page') }}" class="settings-button">
                <img src="{{ url_for('static', filename='icons/settings.png') }}" title="Settings" alt="settings icon" class="icon-image">
            </a>
            <a href="{{ url_for('playlist.playlists') }}" class="settings-button">
                <img src="{{ url_for('static', filename='icons/playlist.png') }}" title="Playlists" alt="playlists icon" class="icon-image">
            </a>
        </header>

        <!-- Display the current image -->
        <div class="image-container" id="imageContainer">
            <img src="{{ url_for('static', filename='images/current_image.png') }}" alt="Current Image" id="currentImage">
            <button class="nav-arrow nav-arrow-left" id="prevButton" title="Previous Image">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <button class="nav-arrow nav-arrow-right" id="nextButton" title="Next Image">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <div class="preview-indicator" id="previewIndicator" style="display: none;">
                <span>Preview</span>
            </div>
            <button class="apply-button" id="applyButton" style="display: none;">
                <span id="applyButtonText">Apply to Display</span>
                <div class="loading-indicator small" id="applyLoader" style="display: none;"></div>
            </button>
        </div>

        <!-- Separator -->
        <div class="separator"></div>
        <h2 class="plugins-title">Plugins</h2>
        <div class="button-grid">
            {% for plugin in plugins %}
            <a href="{{ url_for('plugin.plugin_page', plugin_id=plugin.id) }}" class="icon-button" title="{{ plugin.display_name }}" >
                <img src="{{ url_for('plugin.image', plugin_id=plugin.id, filename='icon.png') }}" alt="{{ plugin.display_name }} icon" class="icon-image">
            </a>
            {% endfor %}
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            const currentImage = document.getElementById('currentImage');
            const previewIndicator = document.getElementById('previewIndicator');
            const applyButton = document.getElementById('applyButton');
            const applyButtonText = document.getElementById('applyButtonText');
            const applyLoader = document.getElementById('applyLoader');
            
            let playlistImages = [];
            let currentDisplayIndex = 0;
            let previewIndex = 0;
            let isPlaylistActive = false;
            
            // Initialize playlist data
            async function initializePlaylist() {
                try {
                    // Check if playlist is active
                    const statusResponse = await fetch('/playlist_status');
                    const statusData = await statusResponse.json();
                    
                    isPlaylistActive = statusData.playlist_active;
                    
                    if (!isPlaylistActive) {
                        prevButton.style.display = 'none';
                        nextButton.style.display = 'none';
                        return;
                    }
                    
                    // Get playlist images
                    const imagesResponse = await fetch('/playlist/images');
                    const imagesData = await imagesResponse.json();
                    
                    if (imagesData.success) {
                        playlistImages = imagesData.images;
                        currentDisplayIndex = imagesData.current_index || 0;
                        previewIndex = currentDisplayIndex;
                        
                        // Debug logging
                        console.log('Playlist initialized:');
                        console.log('Current display index:', currentDisplayIndex);
                        console.log('Images:', playlistImages);
                        console.log('Currently displayed image should be:', playlistImages[currentDisplayIndex]);
                        
                        // Update the image to match what the system thinks is current
                        // This ensures we're in sync with the backend
                        if (playlistImages[currentDisplayIndex]) {
                            currentImage.src = playlistImages[currentDisplayIndex].url + '?t=' + new Date().getTime();
                        }
                    }
                } catch (error) {
                    console.error('Error initializing playlist:', error);
                    prevButton.style.display = 'none';
                    nextButton.style.display = 'none';
                }
            }
            
            // Update preview image
            function updatePreview() {
                if (playlistImages.length > 0 && previewIndex >= 0 && previewIndex < playlistImages.length) {
                    currentImage.src = playlistImages[previewIndex].url + '?t=' + new Date().getTime();
                    console.log('Updating preview to index:', previewIndex, 'Image:', playlistImages[previewIndex].name);
                }
                
                // Show/hide preview indicator and apply button
                const isPreview = previewIndex !== currentDisplayIndex;
                console.log('Preview index:', previewIndex, 'Display index:', currentDisplayIndex, 'Is preview?', isPreview);
                previewIndicator.style.display = isPreview ? 'block' : 'none';
                applyButton.style.display = isPreview ? 'block' : 'none';
            }
            
            // Navigation functions (preview only)
            function navigatePreview(direction) {
                if (playlistImages.length === 0) return;
                
                const oldIndex = previewIndex;
                if (direction === 'next') {
                    previewIndex = (previewIndex + 1) % playlistImages.length;
                } else {
                    previewIndex = (previewIndex - 1 + playlistImages.length) % playlistImages.length;
                }
                
                console.log('Navigate', direction, ': from index', oldIndex, 'to', previewIndex);
                updatePreview();
            }
            
            // Apply preview to display
            async function applyToDisplay() {
                // Disable buttons and show loader
                applyButton.disabled = true;
                prevButton.disabled = true;
                nextButton.disabled = true;
                applyButtonText.style.display = 'none';
                applyLoader.style.display = 'inline-block';
                
                try {
                    const response = await fetch(`/navigate/to/${previewIndex}`, { 
                        method: 'POST' 
                    });
                    const data = await response.json();
                    
                    if (data.success) {
                        currentDisplayIndex = previewIndex;
                        updatePreview(); // This will hide the preview indicator
                        
                        // Brief success feedback
                        applyButtonText.textContent = 'Applied!';
                        applyButtonText.style.display = 'inline';
                        applyLoader.style.display = 'none';
                        
                        setTimeout(() => {
                            applyButtonText.textContent = 'Apply to Display';
                        }, 1500);
                    } else {
                        console.error('Failed to apply:', data.error);
                        applyButtonText.textContent = 'Error - Try Again';
                        applyButtonText.style.display = 'inline';
                        applyLoader.style.display = 'none';
                    }
                } catch (error) {
                    console.error('Error applying to display:', error);
                    applyButtonText.textContent = 'Error - Try Again';
                    applyButtonText.style.display = 'inline';
                    applyLoader.style.display = 'none';
                } finally {
                    // Re-enable buttons
                    setTimeout(() => {
                        applyButton.disabled = false;
                        prevButton.disabled = false;
                        nextButton.disabled = false;
                    }, 1000);
                }
            }
            
            // Event listeners
            prevButton.addEventListener('click', () => navigatePreview('previous'));
            nextButton.addEventListener('click', () => navigatePreview('next'));
            applyButton.addEventListener('click', applyToDisplay);
            
            // Initialize on load
            initializePlaylist();
        });
    </script>
<body>
</html>
